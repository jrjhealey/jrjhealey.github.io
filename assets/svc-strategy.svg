<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Abstract growth trajectory">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4eede"/>
      <stop offset="1" stop-color="#e7ddc9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgT)"/>
  <!-- faint grid -->
  <g stroke="#173829" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="220" x2="800" y2="220"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
  </g>
  <!-- ghost bars -->
  <g fill="#245038" fill-opacity="0.16">
    <rect x="120" y="360" width="46" height="60" rx="4"/>
    <rect x="250" y="300" width="46" height="120" rx="4"/>
    <rect x="380" y="250" width="46" height="170" rx="4"/>
    <rect x="510" y="180" width="46" height="240" rx="4"/>
  </g>
  <!-- rising trajectory -->
  <path d="M110 400 C 240 360, 300 300, 420 250 S 600 150, 690 96" fill="none" stroke="#a0622a" stroke-width="4" stroke-linecap="round"/>
  <!-- milestone dots -->
  <g fill="#173829">
    <circle cx="110" cy="400" r="7"/>
    <circle cx="300" cy="300" r="7"/>
    <circle cx="480" cy="205" r="7"/>
  </g>
  <!-- target at apex -->
  <circle cx="690" cy="96" r="26" fill="none" stroke="#173829" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="690" cy="96" r="15" fill="none" stroke="#a0622a" stroke-width="3"/>
  <circle cx="690" cy="96" r="6" fill="#a0622a"/>
</svg>
