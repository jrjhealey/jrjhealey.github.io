<svg xmlns="http://www.w3.org/2000/svg" width="540" height="540" viewBox="0 0 540 540">
  <g fill="none" stroke="#0e2218" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- molecular lattice: atoms (nodes) joined by bonds -->
    <g opacity="0.55">
      <line x1="70" y1="90" x2="170" y2="60"/>
      <line x1="170" y1="60" x2="230" y2="150"/>
      <line x1="230" y1="150" x2="150" y2="210"/>
      <line x1="150" y1="210" x2="70" y2="90"/>
      <line x1="230" y1="150" x2="340" y2="130"/>
      <line x1="340" y1="130" x2="400" y2="220"/>
      <line x1="400" y1="220" x2="300" y2="270"/>
      <line x1="300" y1="270" x2="230" y2="150"/>
      <line x1="400" y1="220" x2="490" y2="180"/>
      <circle cx="70" cy="90" r="4.5" fill="#0e2218" stroke="none"/>
      <circle cx="170" cy="60" r="4.5" fill="#0e2218" stroke="none"/>
      <circle cx="230" cy="150" r="6" fill="#a0622a" stroke="none"/>
      <circle cx="150" cy="210" r="4.5" fill="#0e2218" stroke="none"/>
      <circle cx="340" cy="130" r="4.5" fill="#0e2218" stroke="none"/>
      <circle cx="400" cy="220" r="6" fill="#a0622a" stroke="none"/>
      <circle cx="300" cy="270" r="4.5" fill="#0e2218" stroke="none"/>
      <circle cx="490" cy="180" r="4.5" fill="#0e2218" stroke="none"/>
    </g>

    <!-- hexagonal ring (aromatic / small molecule) -->
    <g transform="translate(110,360)" opacity="0.5">
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"/>
      <circle cx="0" cy="-30" r="3.6" fill="#0e2218" stroke="none"/>
      <circle cx="26" cy="-15" r="3.6" fill="#0e2218" stroke="none"/>
      <circle cx="26" cy="15" r="3.6" fill="#0e2218" stroke="none"/>
      <circle cx="0" cy="30" r="3.6" fill="#0e2218" stroke="none"/>
      <circle cx="-26" cy="15" r="3.6" fill="#0e2218" stroke="none"/>
      <circle cx="-26" cy="-15" r="3.6" fill="#0e2218" stroke="none"/>
      <line x1="0" y1="30" x2="0" y2="62"/>
      <circle cx="0" cy="62" r="3.6" fill="#a0622a" stroke="none"/>
    </g>

    <!-- double helix strand -->
    <g transform="translate(420,400)" opacity="0.5">
      <path d="M0 0 C 28 16, 28 44, 0 60 C -28 76, -28 104, 0 120"/>
      <path d="M0 0 C -28 16, -28 44, 0 60 C 28 76, 28 104, 0 120"/>
      <line x1="-14" y1="14" x2="14" y2="14"/>
      <line x1="-14" y1="46" x2="14" y2="46"/>
      <line x1="-14" y1="74" x2="14" y2="74"/>
      <line x1="-14" y1="106" x2="14" y2="106"/>
    </g>

    <!-- peptide chain wandering through -->
    <path d="M-10 470 C 80 440, 130 510, 220 480 C 300 454, 350 520, 440 500 C 510 486, 540 520, 560 505" opacity="0.4"/>
  </g>
</svg>
