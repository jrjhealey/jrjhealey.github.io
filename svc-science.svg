<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Abstract molecular network">
  <defs>
    <linearGradient id="bgS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4eede"/>
      <stop offset="1" stop-color="#e7ddc9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgS)"/>
  <!-- faint data curve -->
  <path d="M0 380 C 160 360, 210 250, 340 250 S 520 190, 640 130 800 90 800 90" fill="none" stroke="#173829" stroke-opacity="0.12" stroke-width="2"/>
  <!-- molecular network -->
  <g stroke="#173829" stroke-opacity="0.5" stroke-width="1.6">
    <line x1="150" y1="150" x2="300" y2="220"/>
    <line x1="300" y1="220" x2="250" y2="360"/>
    <line x1="300" y1="220" x2="470" y2="180"/>
    <line x1="470" y1="180" x2="600" y2="280"/>
    <line x1="470" y1="180" x2="560" y2="90"/>
    <line x1="600" y1="280" x2="520" y2="400"/>
    <line x1="250" y1="360" x2="430" y2="410"/>
    <line x1="430" y1="410" x2="520" y2="400"/>
    <line x1="600" y1="280" x2="700" y2="200"/>
  </g>
  <g fill="#245038">
    <circle cx="150" cy="150" r="9"/>
    <circle cx="300" cy="220" r="13"/>
    <circle cx="250" cy="360" r="10"/>
    <circle cx="600" cy="280" r="12"/>
    <circle cx="520" cy="400" r="9"/>
    <circle cx="430" cy="410" r="8"/>
    <circle cx="560" cy="90" r="8"/>
    <circle cx="700" cy="200" r="9"/>
  </g>
  <!-- copper highlight node -->
  <circle cx="470" cy="180" r="20" fill="#a0622a"/>
  <circle cx="470" cy="180" r="30" fill="none" stroke="#c07c3e" stroke-opacity="0.55" stroke-width="1.6"/>
</svg>
